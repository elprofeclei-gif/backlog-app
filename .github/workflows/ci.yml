name: 🧪 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🧪 Run Frontend Tests
        run: |
          cd frontend
          npm run test

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 🧪 Run Backend Tests
        run: |
          cd backend
          npm run test
